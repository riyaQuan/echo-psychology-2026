<div class="shell"><aside class="intro"><div class="brand"><svg aria-hidden="true"><use href="#whale"/></svg><div>回声心理<div class="eyebrow">ECHO · MINDISLE</div></div></div><h1>养一只鲸，<br>也<span class="highlight">照顾自己。</span></h1><p class="lead">你的情绪陪伴小岛。<br>和小回一起，把照顾自己变成温柔的日常。</p><div style="margin-top:22px"><span class="badge">AI 日常陪伴</span> <span class="badge">专业真人支持</span></div><div class="guide"><div class="eyebrow">PRODUCT WALKTHROUGH</div><h3 style="margin-top:8px">从陪伴养成，到可持续服务</h3><div class="steps"><button class="step" data-page="pet">01 领养小回<span>喂食、摸摸、布置小岛</span></button><button class="step" data-page="care">02 照顾彼此<span>情绪觉察与自我关怀练习</span></button><button class="step" data-page="shop">03 小岛商店<span>装扮单购与贝壳兑换</span></button><button class="step" data-page="member">04 回声会员<span>看懂权益与定价逻辑</span></button></div><p class="note">课堂交互原型 · 非真实医疗或咨询服务。聊天为预设演示，咨询师与社区内容均为虚构。请仅使用虚构信息。</p></div><div class="source"><a href="https://riyaquan.github.io/echo-psychology-2026/home.html" target="_blank" rel="noopener">企业官网 ↗</a><a href="https://riyaquan.github.io/echo-psychology-2026/campus.html" target="_blank" rel="noopener">校园招聘 ↗</a></div><p class="note footer-note">设计沿用官网品牌与四大核心功能。<br>《招聘管理》课程 · 第 5 组 · 2026</p></aside>

function today(){return `<div class="row between"><span class="eyebrow">YOUR DAILY ECHO</span><span class="small muted">每一种情绪，都值得被听见</span></div><div class="hero"><span class="pill">鲸鱼伙伴 · 小回</span><h2 style="margin-top:10px">今天，<br>想从哪里开始？</h2><p class="small">不必组织好语言。<br>一句话，也可以。</p><button class="primary" data-page="chat">和小回聊聊 →</button><svg class="whale" aria-hidden="true"><use href="#whale"/></svg></div><section><div class="row between"><h3>此刻的心情像什么？</h3><button class="linkbutton small" data-page="weather">记一笔 →</button></div>${moodButtons()}</section><div class="split"><button class="tile" data-page="counsel"><span class="symbol">♡</span><strong>找真人支持</strong><span>首次 30 分钟免费评估</span></button><button class="tile" data-page="breath"><span class="symbol">◉</span><strong>放松一分钟</strong><span>跟着呼吸，回到此刻</span></button></div><div class="card"><div class="row between"><h3>校园里，也有人懂你</h3><span>♧</span></div><p class="small muted">匿名互助 · 心理活动 · 学校资源</p><button class="linkbutton" data-page="campus">去校园心理角看看 →</button></div><p class="small muted">AI 陪伴不提供诊断。如需专业支持，可随时选择真人咨询。</p>`}

function send(text){text=text.trim();if(!text)return;chats.push({role:'user',text});let reply;if(/自杀|自残|不想活|伤害自己|结束生命|杀死|想死/.test(text)){reply='听到你这样说，我很关心你此刻的安全。请尽快联系现实中的支持，让信任的人陪在身边；如果有紧急危险，请联系 110 或 120。这里无法提供紧急救援。';chats.push({role:'ai',text:reply});go('help');toast('演示检测到危机表达，已展示现实求助渠道；未通知真人。');return}if(/简历|回音|投递/.test(text))reply='花了很多心力，却还没收到回应，这种悬着的感觉可能很难受。暂时没有回复，并不等于你不够好。\n如果你愿意，我们可以先选一件今天能控制的小事：回看一份岗位要求，或先休息十分钟。你更想从哪一件开始？';else if(/面试|紧张/.test(text))reply='面试前担心表现，听起来你很在意这次机会。我们不必立刻消除紧张。\n要不要先想一个问题：你最希望面试官了解你的哪一项经历？也可以先去首页做一分钟放松。';else if(/听一听/.test(text))reply='好呀，这一次我们不急着找办法。你可以慢慢说，也可以停在这里。此刻你最希望被理解的是什么？';else reply='谢谢你愿意说出来。我们可以先把这段心事放在这里，不急着给自己下结论。\n这是预设回应演示，不会分析你的输入或作出诊断。如果希望有更深入的支持，可以自主选择真人咨询。';chats.push({role:'ai',text:reply});render();screen.scrollTop=screen.scrollHeight}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){go(b.dataset.page);return}if(b.dataset.mood!==undefined){mood=Number(b.dataset.mood);if(page==='today'){go('weather')}else{const diary=$('#diary')?.value;render();if(diary!==undefined)$('#diary').value=diary}return}if(b.dataset.tag){tag=b.dataset.tag;const draft=$('#diary')?.value;render();if(draft!==undefined)$('#diary').value=draft;return}if(b.dataset.say){send(b.dataset.say);return}if(b.dataset.person!==undefined){chosen=Number(b.dataset.person);go('detail');return}if(b.dataset.like!==undefined){const p=[...data.posts,...basePosts][Number(b.dataset.like)];if(data.likes.includes(p.text))data.likes=data.likes.filter(t=>t!==p.text);else data.likes.push(p.text);save();render();return}if(b.dataset.report!==undefined){toast('举报交互演示：真实产品应进入审核队列；此处未提交。');return}if(b.dataset.cancel){data.bookings=data.bookings.filter(v=>String(v.id)!==b.dataset.cancel);save();render();toast('已取消本地演示预约。');return}if(b.id==='activity'){go('resources');return}if(b.id==='clear'){data={records:[],bookings:[],posts:[],likes:[],pet:freshPet(),orders:[]};chats=[];save();render();toast('已清除本浏览器的演示记录。');return}if(b.id==='breath-start')startBreath();if(b.id==='breath-stop'){clearInterval(timer);clearInterval(phaseTimer);timer=null;phaseTimer=null;$('#orb').classList.remove('in');$('#breath-label').textContent='恢复自然呼吸';$('#count').textContent='照顾自己的感受，就已经足够。';$('#breath-start').disabled=false}});

function petScene(){const p=data.pet;return `<div class="island ${p.scene==='sunset'?'sunset':p.scene==='forest'?'forest':''}"><span class="sun"></span><span class="cloud">☁</span><button class="pet-touch" id="pet-touch" aria-label="摸摸你的小鲸鱼"><svg aria-hidden="true"><use href="#whale"/></svg><span class="pet-accessory">${itemIcon(p.outfit)}</span></button><div class="pet-name">${esc(p.name)} · ${p.scene==='sunset'?'落日海湾':p.scene==='forest'?'森林小岛':'初见海湾'} · 点击鲸鱼，摸摸它</div></div>`}
const oldToday=today;today=function(){const p=data.pet;return `<div class="row between"><span class="eyebrow">A LITTLE CARE, EVERY DAY</span><span class="pill">陪伴第 ${Math.max(1,p.visits.length)} 天</span></div><h2>照顾小回，<br>也记得照顾自己。</h2><div class="mini-pet"><svg aria-hidden="true"><use href="#whale"/></svg><div><h3>${esc(p.name)}在小岛等你</h3><p class="small">Lv.${petLevel()} · ${p.shells} 贝壳</p><button class="linkbutton small" data-page="pet">去看看它 →</button></div></div><section><div class="row between"><h3>今天的心情像什么？</h3><button class="linkbutton small" data-page="weather">记一笔 →</button></div>${moodButtons()}</section><div class="split"><button class="tile" data-page="chat"><span class="symbol">◌</span><strong>和小回聊聊</strong><span>从一句话开始，被听见</span></button><button class="tile" data-page="care"><span class="symbol">✦</span><strong>自我关怀实验室</strong><span>想法整理 · 感官着陆 · 呼吸</span></button></div><div class="shop-banner"><span class="pill">回声 PLUS · 课程拟定价</span><h3 style="margin-top:8px">让陪伴，拥有你的样子。</h3><p class="small">¥19 / 月 · 专属装扮、主题练习与月度回顾</p><button class="linkbutton small" data-page="member">看看会员权益 →</button></div><div class="card"><button class="section-link" data-page="counsel"><strong>♡ 找真人支持</strong><span class="small">首次免费评估 →</span></button><button class="section-link" data-page="campus"><strong>♧ 校园心理角</strong><span class="small">看看同龄人的回声 →</span></button></div><p class="small muted">基础陪伴、记录与紧急帮助免费开放。宠物不会生病、死亡，也不会因为你缺席而失去成长。</p>`};
function pet(){const p=data.pet;if(!p.visits.includes(dailyKey())){p.visits.push(dailyKey());save()}return `<div class="row between"><div><span class="eyebrow">YOUR LITTLE COMPANION</span><h2>${esc(p.name)}的陪伴小岛</h2></div><button class="chip" data-page="shop">${p.shells} 贝壳 · 商店 →</button></div>${petScene()}<div class="pet-speech" aria-live="polite">${esc(p.speech)}</div><div class="pet-stats"><div><strong>Lv.${petLevel()}</strong><span>陪伴等级</span></div><div><strong>${p.shells}</strong><span>贝壳余额</span></div><div><strong>${p.visits.length}</strong><span>相见天数 · 不要求连续</span></div></div><div><div class="row between small"><span>一起成长</span><span>${p.xp%40} / 40</span></div><div class="meter" role="progressbar" aria-label="本级成长进度" aria-valuenow="${p.xp%40}" aria-valuemin="0" aria-valuemax="40"><div style="width:${p.xp%40/40*100}%"></div></div></div><div class="pet-actions"><button data-pet-action="feed">◒ 喂一口点心</button><button data-pet-action="touch">♡ 轻轻摸摸</button><button data-pet-action="rest">☾ 一起休息</button></div><p class="small muted">每天首次完成每项互动得 5 贝壳，可重复互动；食物免费。离开时小回会休息，不扣成长，也不用付费“救活”。</p><div class="card"><h3>和小回一起，做一件小事</h3>${[['record','看见今天的情绪','weather'],['care','完成一个关怀练习','care'],['breath','尝试一分钟呼吸','breath']].map(([id,label,path])=>`<div class="task"><div><strong class="small">${label}</strong><div class="small muted">${did(id)?'今日已收下奖励':'首次完成 +8 贝壳 · 不看情绪好坏'}</div></div><button class="secondary" data-page="${path}">${did(id)?'再看看':'一起做'}</button></div>`).join('')}</div><details class="card"><summary>给小回起个名字</summary><form id="pet-name-form"><label class="label" for="pet-name">伙伴的名字（最多 8 字）</label><input id="pet-name" name="name" maxlength="8" value="${esc(p.name)}" required><button class="primary full" style="margin-top:12px">保存名字</button></form></details><div class="row"><button class="secondary full" data-page="shop">布置小岛</button><button class="secondary full" data-page="member">回声 Plus</button></div>`}
function care(){return `<span class="eyebrow">SELF-CARE LAB</span><h2>照顾自己的方式，<br>可以从很小开始。</h2><p class="small muted">免费自助练习，不作心理测评或诊断。完成一种练习即可收下今日关怀奖励，无需分享答案。</p><div class="row wrap"><button class="chip ${exercise==='reframe'?'on':''}" data-exercise="reframe">给想法留点空间</button><button class="chip ${exercise==='ground'?'on':''}" data-exercise="ground">回到此时此地</button><button class="chip" data-page="breath">呼吸一分钟 →</button></div>${exercise==='reframe'?`<div class="card"><span class="pill">想法整理 · 约 3 分钟</span><h3 style="margin-top:10px">事实、想法，可以分开看。</h3><p class="small">例如：“简历暂时没有回复”是发生的事；“我肯定不够好”是脑海中的解释。试着给自己另一种看法。</p><form id="care-form"><label class="label" for="fact">发生了什么？</label><textarea id="fact" placeholder="写下你观察到的事，不急着评价自己。" maxlength="300"></textarea><label class="label" for="thought">脑海冒出了什么想法？</label><textarea id="thought" maxlength="300" placeholder="可以只在心里想，不填写。"></textarea><label class="label" for="gentle">如果是朋友遇到这件事，你会怎么说？</label><textarea id="gentle" maxlength="300" placeholder="例如：招聘进度有很多原因，等待不代表你的价值。"></textarea><p class="small muted">此处文字不保存。留空也可以完成，不要求你立刻变得积极。</p><button class="primary full" style="margin-top:14px">完成这次想法整理</button></form></div>`:`<div class="card"><span class="pill">感官着陆 · 约 2 分钟</span><h3 style="margin-top:10px">先注意，自己正在这里。</h3><p>慢慢寻找你能看见的 5 样东西、触到的 4 种质感、听见的 3 种声音、闻到的 2 种气味，以及 1 个你感到舒服的小细节。</p><p class="small muted">不方便感知某一项时，可以跳过或换一种感官。任何不适都可停止。</p><button class="primary full" id="ground-done" style="margin-top:15px">我为自己留了一点空间</button></div>`}<div class="notice">奖励的是照顾自己的行动，不是“变开心”的结果。${did('care')?'今天的关怀奖励已领取。':'今日首次完成可得 8 贝壳。'}</div><button class="secondary full" data-page="pet">回小岛看看小回</button>`}
function shop(){const p=data.pet;return `<div class="row between"><div><span class="eyebrow">ISLAND STUDIO</span><h2>把小岛，装成喜欢的样子。</h2></div></div><div class="shop-banner"><strong>◈ ${p.shells} 贝壳</strong><p class="small">通过免费互动和自我关怀获得，不出售贝壳。</p></div><h3>用日常的照顾，换一份可爱</h3><div class="products">${products.filter(x=>x.shells).map(productCard).join('')}</div><h3>喜欢的外观，也可以单独购买</h3><p class="small muted">课程拟定价 · 纯外观、固定款式，无随机抽取。付费不影响陪伴等级和基础求助。</p><div class="products">${products.filter(x=>x.price).map(productCard).join('')}</div><div class="card"><h3>换回初见的模样</h3><div class="row wrap" style="margin-top:10px"><button class="chip" data-equip="classic">基础小回 · 免费</button><button class="chip" data-equip="ocean">初见海湾 · 免费</button></div></div><button class="secondary full" data-page="member">查看回声 Plus · ¥19 / 月 →</button>`}
function productCard(p){const leased=data.pet.member&&['star','forest'].includes(p.id);const owned=data.pet.owned.includes(p.id)||leased;const active=data.pet[p.kind]===p.id;return `<div class="product"><div class="product-preview">${p.icon}</div><h3>${p.name}</h3><p class="muted">${p.desc}${leased&&!data.pet.owned.includes(p.id)?' · 会员使用权':''}</p><p><strong>${p.shells?p.shells+' 贝壳':'¥'+p.price+' / 件'}</strong></p><button class="secondary" ${active?'disabled':''} ${owned?`data-equip="${p.id}"`:p.shells?`data-redeem="${p.id}"`:`data-buy="${p.id}"`}>${active?'使用中':owned?'换上它':p.shells?'兑换':'查看演示订单'}</button></div>`}
function member(){const on=data.pet.member;return `<span class="eyebrow">ECHO PLUS</span><h2>为个性化陪伴付费，<br>让基础支持始终可及。</h2><div class="plan"><span class="pill" style="color:var(--navy)">课程商业方案 · 拟定价</span><h3 style="margin-top:14px">回声 Plus · 月度体验</h3><p class="price" style="margin-top:8px">¥19 <small>/ 30 天</small></p><p class="small muted">单次购买，不默认自动续费</p><ul><li>会员期间使用星星睡帽与森林岛</li><li>主题自我关怀内容库（规划权益）</li><li>月度情绪回顾与自选导出（规划权益）</li></ul><button class="primary full" ${on?'disabled':'data-buy="plus"'}>${on?'演示体验已开启':'看看会员演示订单 →'}</button></div><div class="card"><h3>免费版已经能做什么？</h3><div class="benefit-row">✓ 基础小回、喂食摸摸、全部成长等级</div><div class="benefit-row">✓ 心情记录、基础 AI 陪伴、三种自助练习</div><div class="benefit-row">✓ 校园资源、真人咨询入口、紧急帮助</div><p class="small muted">本原型 AI 为预设对话。会员库与月报为方案展示，当前未实现，不以真实商品售卖。</p></div><div class="card"><h3>会员不是咨询服务包</h3><p class="small">真人咨询按次独立收费；首次 30 分钟免费评估沿用官网设定。会员不承诺疗效，也不包含无限次真人咨询。</p><button class="linkbutton small" data-page="counsel">了解专业支持 →</button></div><p class="small muted">演示体验只模拟权益开关，不扣款、不自动续费、不产生真实会员期限。拟定价需经过用户访谈与成本验证。</p>`}
function checkout(){const p=pendingProduct;if(!p)return '<p>还没有选择商品。</p><button class="secondary" data-page="shop">返回商店</button>';return `<button class="back" data-page="${p.id==='plus'?'member':'shop'}">← 返回</button><h2>确认你选择的陪伴</h2><div class="card"><h3>${p.name}</h3><p class="price">¥${p.price}<small> ${p.id==='plus'?'/ 30 天（拟定）':'/ 件（拟定）'}</small></p><p class="small">${p.id==='plus'?'会员期间解锁指定装扮；内容库与月报为规划权益。演示仅开关装扮权限。':'固定外观永久拥有；不是随机礼包。'}</p></div><div class="notice">这是模拟订单，不是实际购买；不调用微信、支付宝或银行卡，不收款。正式上线需明示服务期限、退费和数字商品规则。</div><form id="purchase-form"><label class="check"><input type="checkbox" required><span>我了解这是课程演示，所有价格为本次新增商业假设，当前不会产生费用或自动续费。</span></label><button class="primary full" style="margin-top:18px">确认模拟购买 · 不扣款</button></form>`}
const oldMine=mine;mine=function(){return `<div class="card"><div class="row between"><h3>回声 Plus</h3><span class="pill">${data.pet.member?'演示体验中':'免费陪伴用户'}</span></div><button class="linkbutton" data-page="member">查看会员权益 →</button>${data.pet.member?'<button class="linkbutton small" id="leave-plus">结束会员演示体验</button>':''}</div><div class="card"><h3>我的模拟订单</h3>${data.orders.length?data.orders.map(o=>`<div class="order-list">${esc(o.name)} · ¥${o.price}<br><span class="muted">模拟已完成 · 实付 ¥0 · 不扣款</span></div>`).join(''):'<p class="small muted">还没有订单，免费陪伴可以一直用。</p>'}</div>`+oldMine()};
const oldRender=render;render=function(){oldRender();if(page==='weather'){screen.insertAdjacentHTML('beforeend',`<div class="notice">${did('record')?'今日记录奖励已收下。':'记录任何一种心情，都能获得今日 8 贝壳。'}</div>`)}if(page==='breath')screen.insertAdjacentHTML('beforeend','<div class="notice">尝试完这一分钟，小回会收下今天的 8 贝壳奖励。随时停止也没关系。</div>')};
function petAction(action){const messages={feed:'谢谢点心！你今天也记得好好吃一顿饭呀。',touch:'摸摸收到啦。不论今天心情怎样，我都欢迎你。',rest:'我们一起歇一会儿。休息不需要先把事情做完。'};data.pet.speech=messages[action];const got=reward('pet-'+action,5);save();render();if(got)toast('首次互动 +5 贝壳。重复陪伴也很好。')}
function finishCare(){const got=reward('care');data.pet.speech='今天你为自己留了空间。这件小事，值得被记住。';save();render();toast(got?'关怀练习完成 · +8 贝壳。':'练习完成。今天的奖励已收下，可以随时再来。')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.petAction){petAction(b.dataset.petAction);return}if(b.id==='pet-touch'){petAction('touch');return}if(b.dataset.exercise){exercise=b.dataset.exercise;render();return}if(b.id==='ground-done'){finishCare();return}if(b.dataset.redeem){const p=products.find(x=>x.id===b.dataset.redeem);if(data.pet.owned.includes(p.id))return;if(data.pet.shells<p.shells){toast('贝壳还差 '+(p.shells-data.pet.shells)+' 枚，免费互动就能慢慢攒。');return}data.pet.shells-=p.shells;data.pet.owned.push(p.id);data.pet[p.kind]=p.id;save();render();toast('已兑换并换上 '+p.name);return}if(b.dataset.equip){const id=b.dataset.equip;if(!data.pet.owned.includes(id)&&!(data.pet.member&&['star','forest'].includes(id)))return;const kind=id==='ocean'?'scene':id==='classic'?'outfit':products.find(x=>x.id===id).kind;data.pet[kind]=id;save();render();toast('已换好，回小岛看看吧。');return}if(b.dataset.buy){pendingProduct=b.dataset.buy==='plus'?{id:'plus',name:'回声 Plus · 月度体验',price:19}:products.find(x=>x.id===b.dataset.buy);go('checkout');return}if(b.id==='leave-plus'){data.pet.member=false;for(const [kind,id]of [['outfit','star'],['scene','forest']])if(data.pet[kind]===id&&!data.pet.owned.includes(id))data.pet[kind]=kind==='outfit'?'classic':'ocean';save();render();toast('会员演示已结束。单独购买的外观仍保留。')}});
document.addEventListener('submit',e=>{if(e.target.id==='pet-name-form'){e.preventDefault();data.pet.name=new FormData(e.target).get('name').trim().slice(0,8)||'小回';save();render();toast('新的名字，收到了。')}if(e.target.id==='care-form'){e.preventDefault();finishCare()}if(e.target.id==='diary-form'){const got=reward('record');if(got)toast('心情已记录 · +8 贝壳。情绪不用分好坏。')}if(e.target.id==='purchase-form'){e.preventDefault();const p=pendingProduct;if(!p)return;if(p.id==='plus'){if(!data.pet.member){data.pet.member=true;data.pet.outfit='star';data.pet.scene='forest';data.orders.unshift({name:p.name,price:p.price})}}else if(!data.pet.owned.includes(p.id)){data.pet.owned.push(p.id);data.pet[p.kind]=p.id;data.orders.unshift({name:p.name,price:p.price})}save();pendingProduct=null;go('pet');toast('模拟完成 · 实付 ¥0，外观已应用。')}});
const oldBreath=startBreath;startBreath=function(){oldBreath();let count=0;if(phaseTimer)clearInterval(phaseTimer);phaseTimer=setInterval(()=>{count++;if(count>=60){clearInterval(phaseTimer);phaseTimer=null;if(reward('breath'))toast('谢谢你照顾自己 · +8 贝壳。')}},1000)};

go('today');
</script></body></html>
